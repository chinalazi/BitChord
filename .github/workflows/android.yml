name: Android Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-prod-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Secrets (Keystore & local.properties)
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        touch local.properties
        if [ -n "${{ secrets.LASTFM_API_KEY }}" ]; then
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" >> local.properties
        fi
        if [ -n "${{ secrets.LASTFM_SECRET }}" ]; then
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
        fi
        if [ -n "${{ secrets.LISTEN_TOGETHER_SERVER }}" ]; then
          echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties
        fi

        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > bitchord-release.jks
          {
            echo "storeFile=bitchord-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
        else
          keytool -genkeypair -v -keystore bitchord-release.jks -storetype PKCS12 \
            -keyalg RSA -keysize 2048 -validity 10000 -alias bitchord \
            -storepass bitchord123 -keypass bitchord123 \
            -dname "CN=BitChord, OU=Dev, O=BitChord, L=Local, ST=Local, C=CN"
          {
            echo "storeFile=bitchord-release.jks"
            echo "storePassword=bitchord123"
            echo "keyAlias=bitchord"
            echo "keyPassword=bitchord123"
          } > keystore.properties
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Signed Prod Release APK
      run: ./gradlew :app:assembleProdRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-prod-release-signed
        path: app/build/outputs/apk/prod/release/*.apk
